          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: post
            Auth:
              Authorizer: NONE
        BelowResourceDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: delete
            Auth:
              Authorizer: NONE

Outputs:
  ApiEndpoint:
    Description: The API's base URL (the service description is at its root)
    Value: !Sub "https://${WASHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  IdDomainUrl:
    Description: The identity domain a Space's did:webvh log resolves from
    Value: !Sub "https://${IdDomain}/"
  IdDistributionId:
    Description: The identity domain's CloudFront distribution
    Value: !Ref IdDistribution
  WasLibLayer:
    Description: The shared-code layer ARN
    Value: !Ref WasLibLayer
