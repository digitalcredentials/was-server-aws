AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wallet Attached Storage API (WAS v0.5)

Parameters:
  # Base URL that provisioned space URLs are built from; a space's registry
  # row is keyed {SpaceBaseUrl}/{bucket name}.
  SpaceBaseUrl:
    Type: String
    Default: https://was.lcw-sandbox.org/space
  # The identity domain did:webvh DIDs of this deployment's accounts name
  # (did:webvh:{scid}:{IdDomain}:{spaceId}). A log at that location is the
  # `id/did.jsonl` resource of the named Space, read from its bucket; any
  # other did:webvh is fetched over HTTPS.
  IdDomain:
    Type: String
    Default: id.lcw-sandbox.org
  # The identity domain is served by a CloudFront distribution in front of
  # the API's own domain: /{spaceId}/did.jsonl and /{spaceId}/did.json are
  # rewritten onto the Space's `id` collection. The certificate must cover
  # IdDomain and live in us-east-1; the zone takes the alias records.
  ApiDomain:
    Type: String
    Description: The API's public host name, the distribution's origin.
    Default: was.lcw-sandbox.org
  IdCertificateArn:
    Type: String
    Description: ACM certificate (us-east-1) covering IdDomain.
    Default: arn:aws:acm:us-east-1:747170788015:certificate/c63f6ba4-2630-4c4f-973f-4fd6436962f0
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone the IdDomain alias records go in.
    Default: Z04250862QG6MQUAE24XV

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    Layers:
      - !Ref WasLibLayer
    Environment:
      Variables:
        # The spaces registry (WasSpacesTable below).
        SPACES_TABLE_NAME: !Ref WasSpacesTable
        COUPONS_TABLE_NAME: was-coupons
        SPACE_URL_BASE: !Ref SpaceBaseUrl
        ID_DOMAIN: !Ref IdDomain
        INSTANCE_VERSION: '0.5.0'

Resources:
  # Space-creation coupons, owned by this stack: one row per coupon string.
  # Optional attributes: usesRemaining (N; absent = unlimited) and expiresAt
  # (ISO timestamp; absent = never). POST /spaces/ redeems a coupon from here;
  # whoever administers the deployment mints rows (the wallet back end seeds
  # its registration code as an unlimited coupon).
  WasCouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: was-coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coupon
          AttributeType: S
      KeySchema:
        - AttributeName: coupon
          KeyType: HASH

  # The spaces registry: one row per Space, keyed by its URL (no trailing
  # slash), carrying the controller DID (`did`), the type array, the name and
  # the creation time, with a by-did index for the listing. The authorizer
  # reads it on every request and the Space functions write it. Nothing else
  # should: lcw-back-end's registration and login still use it by name until
  # stage 3 of the did:webvh work removes that.
  WasSpacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: was-spaces
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: spaceURL
          AttributeType: S
        - AttributeName: did
          AttributeType: S
      KeySchema:
        - AttributeName: spaceURL
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-did
          KeySchema:
            - AttributeName: did
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # The code every endpoint function shares (layers/was-lib, resolved as
  # `was-lib/...` from /opt/nodejs/node_modules). Plain ES modules with no
  # dependency beyond the AWS SDK the runtime provides, so the layer is
  # packaged as-is. The layer grants nothing: each function's role bounds
  # what the shared code may do when running in that function.
  WasLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: was-lib
      ContentUri: layers/was-lib
      CompatibleRuntimes:
        - nodejs24.x
      RetentionPolicy: Delete

  # ---------------------------------------------------------------------------
  # The identity domain: did:webvh:{scid}:{IdDomain}:{spaceId} resolves by
  # fetching https://{IdDomain}/{spaceId}/did.jsonl, which this distribution
  # rewrites onto the Space's world-readable `id` collection on the API. A
  # DID therefore names the identity domain, not the storage host, and if
  # the Space moves the distribution's origin (or a redirect here) follows
  # it. Nothing is cached: a resolver must see the log as it is now.
  IdRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-id-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrites /{spaceId}/did.jsonl onto /space/{spaceId}/id/did.jsonl
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var match = request.uri.match(/^\/([A-Za-z0-9_-]+)\/(did\.jsonl|did\.json)$/);
          if (!match) {
            return {
              statusCode: 404,
              statusDescription: 'Not Found',
              headers: { 'content-type': { value: 'text/plain' } },
              body: 'Not found'
            };
          }
          request.uri = '/space/' + match[1] + '/id/' + match[2];
          return request;
        }

  IdDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub did:webvh identity domain for ${AWS::StackName}
        Aliases:
          - !Ref IdDomain
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: api
            DomainName: !Ref ApiDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          # CachingDisabled: every resolution reads the log as it stands.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader: the Origin header reaches the API so
          # its CORS answers browsers resolving a DID.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IdRewriteFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref IdCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  IdDnsA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref IdDomain
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt IdDistribution.DomainName

  IdDnsAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref IdDomain
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt IdDistribution.DomainName

  # An HTTP API rather than a REST API: its CORS is a gateway feature that
  # injects the headers into every response, and its $default stage serves
  # at the root, so URLs carry no stage prefix.
  WASHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: WASZcapAuthorizer
        Authorizers:
          WASZcapAuthorizer:
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            FunctionArn: !GetAtt WASZcapAuthorizerFn.Arn
            # No Identity.Headers: an identity source would make API Gateway
            # answer unsigned requests itself with a 401, and unsigned GETs
            # must reach the functions for the public-read policy check.
            Identity:
              # Every zcap invocation is signed over its own request, so a
              # cached authorization result would be meaningless. 0 disables
              # the authorizer result cache.
              ReauthorizeEvery: 0
      CorsConfiguration:
        AllowMethods:
          - GET
          - HEAD
          - POST
          - PUT
          - DELETE
          - OPTIONS
        # '*' covers the signed headers (authorization, capability-invocation,
        # digest, date, if-match, key-epoch, ...) and anything a client adds.
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'
        # A browser client needs the validators and the discovery link.
        ExposeHeaders:
          - ETag
          - Location
          - Link
          - Last-Modified
          - Content-Type
        MaxAge: 600

  # Verifies the capability invocation of every signed request and reports
  # the result in the request context (signed, verified, controller,
  # delegated, spaceController, spaceType, or space=missing). It never
  # denies: a gateway denial is always a 403, and the spec's answers to an
  # unauthorized request are shaped by the endpoint functions.
  WASZcapAuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/authorizer
      Handler: app.lambdaHandler
      # Resolving a did:webvh controller means reading and verifying its
      # log, which a signed request can make the authorizer do once per
      # cache lifetime.
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WasSpacesTable
        - Statement:
            # The DID logs of this deployment's accounts, read from their
            # Spaces' buckets (ListBucket on the one key so a missing log is
            # a 404 rather than a 403).
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/id/did.jsonl
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/collections/id/did.jsonl
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        # The verification stack is bundled; the shared layer and the SDK
        # are provided at run time.
        External:
          - "@aws-sdk/*"
          - "was-lib/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        # createRequire lets the bundled CJS dependencies work inside an ESM
        # output.
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # ---------------------------------------------------------------------------
  # One function per endpoint. Each carries only the actions and key prefixes
  # its operation touches: a read function cannot write or delete, a
  # function on one prefix (meta/, policies/, collections/) cannot reach
  # another, and only the two Space-level functions can create or delete a
  # bucket or a registry row. Functions that serve unsigned public reads also
  # read policies/* for the PublicCanRead cascade.
  # ---------------------------------------------------------------------------

  # GET / -- the service description. No authorization, no permissions.
  ServiceGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/service/get
      Handler: app.lambdaHandler
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /
            Method: get
            Auth:
              Authorizer: NONE
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /
            Method: head
            Auth:
              Authorizer: NONE

  # POST /spaces/ -- provision a Space: a bucket with its metadata object, a
  # registry row, and a redeemed coupon.
  SpacesPostFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/spaces/post
      Handler: app.lambdaHandler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref WasSpacesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WasCouponsTable
        - Statement:
            - Effect: Allow
              Action: s3:CreateBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/space.json
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: post
        PostSlash:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces/{p}
            Method: post

  # GET /spaces/ -- the signer's Spaces, from the registry's by-did index.
  SpacesGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/spaces/get
      Handler: app.lambdaHandler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref WasSpacesTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: get
        GetSlash:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces/{p}
            Method: get

  # GET /space/{s}/ -- the Space's Collections. The gateway delivers the
  # trailing-slash container URL to the {collection_id} route with an empty
  # id; a non-empty id (the bare Collection URL) is answered with a 308.
  SpaceCollectionsGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/collections-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: head

  # POST /space/{s}/ -- create a Collection (its metadata object).
  CollectionCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/collection-create
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: post

  # DELETE /space/{s}/ -- the whole Space: empty and remove the bucket, then
  # the registry row. The only function that can delete a bucket.
  SpaceDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/delete
      Handler: app.lambdaHandler
      # Emptying a bucket can outlast the default.
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt WasSpacesTable.Arn
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:DeleteBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/*
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: delete

  # GET /space/{s}/meta
  SpaceMetaGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/meta-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - meta/space.json
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/meta/space.json
                - arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: head

  # PUT /space/{s}/meta -- also mirrors the name to the registry row.
  SpaceMetaPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/meta-put
      Handler: app.lambdaHandler
      # Promoting a controller resolves the did:webvh's log.
      Timeout: 10
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys (the metadata object, and the DID log a
            # promotion resolves).
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - meta/space.json
                  - collections/id/did.jsonl
        - Statement:
            # UpdateItem mirrors the name and records a promoted controller;
            # PutItem and CreateBucket provision an unlock Space.
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt WasSpacesTable.Arn
            - Effect: Allow
              Action: s3:CreateBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/space.json
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/collections/id/did.jsonl
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: put
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        # The did:webvh driver is bundled; the shared layer and the SDK are
        # provided at run time.
        External:
          - "@aws-sdk/*"
          - "was-lib/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # /space/{s}/policy
  SpacePolicyGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: get

  SpacePolicyPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: put

  SpacePolicyDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-delete
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: delete

  # GET /space/{s}/{c}/{r} -- a Resource's content; with an empty
  # resource_id (the gateway's reading of /space/{s}/{c}/), the Collection's
  # listing.
  ResourceGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: head

  # POST /space/{s}/{c}/ -- create a Resource with a server-assigned id (a
  # first write into a new Collection also writes its metadata object).
  ResourceCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/create
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: post

  # PUT /space/{s}/{c}/{r} -- create or replace a Resource.
  ResourcePutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: put

  # DELETE /space/{s}/{c}/{r} -- a Resource with its metadata and policy;
  # with an empty resource_id, the whole Collection.
  ResourceDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/delete
      Handler: app.lambdaHandler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
