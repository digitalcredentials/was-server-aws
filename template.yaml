AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wallet Attached Storage API

Parameters:
  # The wallet account table (owned by the lcw-back-end stack): email -> did
  # plus the registration token that serves as the space-creation coupon.
  AccountTableName:
    Type: String
    Default: wallet-test
  # Base URL that provisioned space URLs are built from; a space lands at
  # {SpaceBaseUrl}/{bucket name}.
  SpaceBaseUrl:
    Type: String
    Default: https://was.lcw-sandbox.org/space

Globals:
  Function:
    Timeout: 3
    Runtime: nodejs24.x

Resources:
  # Space-creation coupons, owned by this stack: one row per coupon string.
  # Optional attributes: usesRemaining (N; absent = unlimited) and expiresAt
  # (ISO timestamp; absent = never). POST /spaces redeems a coupon from here;
  # whoever administers the deployment mints rows (the wallet back end seeds
  # its registration code as an unlimited coupon).
  WasCouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: was-coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coupon
          AttributeType: S
      KeySchema:
        - AttributeName: coupon
          KeyType: HASH

  # Unused since verifyZcap moved into src/authorizer and its deps were bundled
  # into that function. Nothing imports /opt/nodejs/dcc-shared-layer-utils any
  # more. The source is still in src/sharedLayer/ if this needs to come back.
  # DCCSharedLayer:
  #   Type: AWS::Serverless::LayerVersion
  #   Properties:
  #     ContentUri: src/sharedLayer/
  #     CompatibleRuntimes:
  #       - nodejs24.x
  #   Metadata:
  #     # gotta use a makefile because layers can't be built with esbuild, only functions can,
  #     # and we need esbuild to use ESM modules and CJS modules together.
  #     BuildMethod: makefile


  # The shared API Gateway. An HTTP API rather than a REST API: its CORS is a
  # real gateway feature that injects the headers into every response (on a
  # REST API only the OPTIONS preflight can be configured centrally; each
  # proxied response would have to carry its own headers). It also serves the
  # $default stage at the root, so URLs carry no /Prod prefix.
  WASHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: WASZcapAuthorizer
        Authorizers:
          WASZcapAuthorizer:
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            FunctionArn: !GetAtt WASZcapAuthorizerFn.Arn
            # No Identity.Headers: an identity source would make API Gateway
            # answer unsigned requests itself with a 401, and unsigned GETs
            # must reach the authorizer for the public-read policy check.
            Identity:
              # Every zcap invocation is signed over its own request, so a
              # cached authorization decision would be meaningless. 0 disables
              # the authorizer result cache.
              ReauthorizeEvery: 0
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        # '*' covers the signed headers (authorization, capability-invocation,
        # digest, date) and anything a client adds later.
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'

  # Verifies the zcap invocation for every route on WASHttpApi.
  WASZcapAuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/authorizer
      Handler: app.lambdaHandler
      # No layer: the zcap verification deps are bundled into the function.
      Timeout: 10
      Environment:
        Variables:
          # Spaces registry (owned by the lcw-back-end stack): one row per
          # WAS space, keyed by spaceURL, carrying the controller did and the
          # space's type ('credential' | 'batch').
          SPACES_TABLE_NAME: wallet-spaces
      Policies:
        - DynamoDBReadPolicy:
            TableName: wallet-spaces
        # Public-read checks read policy documents from the space buckets
        - S3ReadPolicy:
            BucketName: '*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # The space registry endpoints (POST /spaces, GET /spaces) of the WAS spec.
  # These routes have no space in their URL, so the standard authorizer cannot
  # resolve a controller for them; they verify the zcap invocation in-handler
  # instead (POST against the controller DID in the body, per the spec; GET
  # against the DID registered for the account). Space creation additionally
  # requires redeeming a coupon from the was-coupons table.
  SpacesRegistryFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/spaces/registry
      Handler: app.lambdaHandler
      # zcap verification resolves did:key documents; same budget as the
      # authorizer.
      Timeout: 10
      Environment:
        Variables:
          ACCOUNTS_TABLE_NAME: !Ref AccountTableName
          SPACES_TABLE_NAME: wallet-spaces
          COUPONS_TABLE_NAME: !Ref WasCouponsTable
          SPACE_URL_BASE: !Ref SpaceBaseUrl
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AccountTableName
        - DynamoDBCrudPolicy:
            TableName: wallet-spaces
        # Redeeming a finite coupon decrements its usesRemaining.
        - DynamoDBCrudPolicy:
            TableName: !Ref WasCouponsTable
        # Space buckets all share the dcc-was- prefix, so bucket provisioning
        # is scoped to it.
        - Statement:
            - Effect: Allow
              Action:
                - s3:CreateBucket
                - s3:PutObject
              Resource:
                - arn:aws:s3:::dcc-was-*
                - arn:aws:s3:::dcc-was-*/*
      Events:
        CreateSpace:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: post
            Auth:
              Authorizer: NONE
        ListSpaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: get
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # DELETE /space/{space_id}: deletes a batch space (bucket + registry row).
  # Runs behind the standard authorizer, which verifies the invocation against
  # the space's registered controller DID — the spec's deletion rule.
  SpaceDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/spaces/delete
      Handler: app.lambdaHandler
      # Emptying a bucket can outlast the 3s default.
      Timeout: 30
      Environment:
        Variables:
          SPACES_TABLE_NAME: wallet-spaces
      Policies:
        - DynamoDBCrudPolicy:
            TableName: wallet-spaces
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:DeleteObject
                - s3:DeleteBucket
              Resource:
                - arn:aws:s3:::dcc-was-*
                - arn:aws:s3:::dcc-was-*/*
      Events:
        DeleteSpace:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: delete

  CollectionsGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/collections/get
      Handler: app.lambdaHandler
      # Layers:
      #   - !Ref DCCSharedLayer # References the layer above
      Policies:
        - S3ReadPolicy:
            BucketName: '*'
      Events:
        GetCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: get
  
  SpaceCollectionsListGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/spaces/get
      Handler: app.lambdaHandler
      # Layers:
      #   - !Ref DCCSharedLayer # References the layer above
      Policies:
        - S3ReadPolicy:
            BucketName: '*'
      Events:
        GetCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/collections
            Method: get

  SpaceDescriptionGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/spaces/description/get
      Handler: app.lambdaHandler
      # Layers:
      #   - !Ref DCCSharedLayer # References the layer above
      Policies:
        - S3ReadPolicy:
            BucketName: '*'
      Events:
        GetSpaceDescription:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: get

  # Update the space's description document.
  SpaceDescriptionPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/spaces/description/put
      Handler: app.lambdaHandler
      Policies:
        - S3WritePolicy:
            BucketName: '*'
      Events:
        PutSpaceDescription:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: put

  # Update-or-create a collection description by id.
  # https://w3c-ccg.github.io/wallet-attached-storage-spec/#update-or-create-by-id-collection-operation
  CollectionsPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/collections/put
      Handler: app.lambdaHandler
      Policies:
        # Crud (not Write) because the handler HeadObjects first to decide
        # between 201 Created and 204 No Content.
        - S3CrudPolicy:
            BucketName: '*'
      Events:
        PutCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: put

  # Update-or-create a resource in a collection.
  # https://w3c-ccg.github.io/wallet-attached-storage-spec/#http-api-put-space-space_id-collection_id-resource_id
  ResourcesPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/resources/put
      Handler: app.lambdaHandler
      Policies:
        # Crud (not Write) because the handler HeadObjects first to decide
        # between 201 Created and 204 No Content.
        - S3CrudPolicy:
            BucketName: '*'
      Events:
        PutResource:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: put

  # Read a resource from a collection.
  # https://w3c-ccg.github.io/wallet-attached-storage-spec/#http-api-get-space-space_id-collection_id-resource_id
  ResourcesGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/resources/get
      Handler: app.lambdaHandler
      Policies:
        - S3ReadPolicy:
            BucketName: '*'
      Events:
        GetResource:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: get

  # Delete a resource: moves it into the space's Trash collection (a delete
  # from Trash itself removes it permanently).
  # https://w3c-ccg.github.io/wallet-attached-storage-spec/#http-api-delete-space-space_id-collection_id-resource_id
  ResourcesDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/resources/delete
      Handler: app.lambdaHandler
      Policies:
        # Crud: the soft delete copies the object into Trash (read + write)
        # before removing the original.
        - S3CrudPolicy:
            BucketName: '*'
      Events:
        DeleteResource:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: delete

  # Access-control policies at all three scopes; the authorizer enforces
  # PublicCanRead for unsigned reads.
  # https://w3c-ccg.github.io/wallet-attached-storage-spec/#access-control
  PoliciesFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/policies
      Handler: app.lambdaHandler
      Policies:
        - S3CrudPolicy:
            BucketName: '*'
      Events:
        SpacePolicyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: get
        SpacePolicyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: put
        SpacePolicyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: delete
        CollectionPolicyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: get
        CollectionPolicyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: put
        CollectionPolicyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: delete
        ResourcePolicyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: get
        ResourcePolicyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: put
        ResourcePolicyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: delete

Outputs:
  WASZcapAuthorizerFn:
    Description: zCap REQUEST authorizer Lambda Function ARN
    Value: !GetAtt WASZcapAuthorizerFn.Arn
  WASZcapAuthorizerFnIamRole:
    Description: Implicit IAM Role created for the zCap authorizer function
    Value: !GetAtt WASZcapAuthorizerFnRole.Arn
  CollectionsApi:
    Description: API Gateway endpoint URL for Collections endpoint of WAS API
    Value: !Sub https://${WASHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/space/{space_id}/{collection_id}
  ResourcesApi:
    Description: API Gateway endpoint URL for Resources endpoint of WAS API
    Value: !Sub https://${WASHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/space/{space_id}/{collection_id}/{resource_id}
  ApiEndpoint:
    Description: "API Gateway HTTP backend URL"
    Value: !Sub "https://${WASHttpApi}.execute-api.${AWS::Region}://"
  CollectionsGetFn:
    Description: GET Collections Lambda Function ARN
    Value: !GetAtt CollectionsGetFn.Arn
  CollectionsGetFnIamRole:
    Description: Implicit IAM Role created for GET Collections function
    Value: !GetAtt CollectionsGetFnRole.Arn
  SpaceCollectionsListGetFn:
    Description: GET Space collections list Lambda Function ARN
    Value: !GetAtt SpaceCollectionsListGetFn.Arn
  SpaceCollectionsListGetFnIamRole:
    Description: Implicit IAM Role created for GET Space collections list function
    Value: !GetAtt SpaceCollectionsListGetFnRole.Arn
  SpaceDescriptionApi:
    Description: API Gateway endpoint URL for the Space description endpoint of WAS API
    Value: !Sub https://${WASHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/space/{space_id}
  SpaceDescriptionGetFn:
    Description: GET Space description Lambda Function ARN
    Value: !GetAtt SpaceDescriptionGetFn.Arn
  SpaceDescriptionGetFnIamRole:
    Description: Implicit IAM Role created for GET Space description function
    Value: !GetAtt SpaceDescriptionGetFnRole.Arn
  CollectionsPutFn:
    Description: PUT Collection Lambda Function ARN
    Value: !GetAtt CollectionsPutFn.Arn
  CollectionsPutFnIamRole:
    Description: Implicit IAM Role created for PUT Collection function
    Value: !GetAtt CollectionsPutFnRole.Arn
  ResourcesPutFn:
    Description: PUT Resource Lambda Function ARN
    Value: !GetAtt ResourcesPutFn.Arn
  ResourcesPutFnIamRole:
    Description: Implicit IAM Role created for PUT Resource function
    Value: !GetAtt ResourcesPutFnRole.Arn
  ResourcesGetFn:
    Description: GET Resource Lambda Function ARN
    Value: !GetAtt ResourcesGetFn.Arn
  ResourcesGetFnIamRole:
    Description: Implicit IAM Role created for GET Resource function
    Value: !GetAtt ResourcesGetFnRole.Arn
