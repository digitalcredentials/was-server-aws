AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Wallet Attached Storage API (WAS v0.5)

Parameters:
  # Base URL that provisioned space URLs are built from; a space's registry
  # row is keyed {SpaceBaseUrl}/{bucket name}.
  SpaceBaseUrl:
    Type: String
    Default: https://was.lcw-sandbox.org/space

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    Layers:
      - !Ref WasLibLayer
    Environment:
      Variables:
        # Spaces registry (table owned by the lcw-back-end stack): one row
        # per Space, keyed by spaceURL, carrying the controller did, the type
        # array and the name.
        SPACES_TABLE_NAME: wallet-spaces
        COUPONS_TABLE_NAME: was-coupons
        SPACE_URL_BASE: !Ref SpaceBaseUrl
        INSTANCE_VERSION: '0.5.0'

Resources:
  # Space-creation coupons, owned by this stack: one row per coupon string.
  # Optional attributes: usesRemaining (N; absent = unlimited) and expiresAt
  # (ISO timestamp; absent = never). POST /spaces/ redeems a coupon from here;
  # whoever administers the deployment mints rows (the wallet back end seeds
  # its registration code as an unlimited coupon).
  WasCouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: was-coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: coupon
          AttributeType: S
      KeySchema:
        - AttributeName: coupon
          KeyType: HASH

  # The code every endpoint function shares (layers/was-lib, resolved as
  # `was-lib/...` from /opt/nodejs/node_modules). Plain ES modules with no
  # dependency beyond the AWS SDK the runtime provides, so the layer is
  # packaged as-is. The layer grants nothing: each function's role bounds
  # what the shared code may do when running in that function.
  WasLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: was-lib
      ContentUri: layers/was-lib
      CompatibleRuntimes:
        - nodejs24.x
      RetentionPolicy: Delete

  # An HTTP API rather than a REST API: its CORS is a gateway feature that
  # injects the headers into every response, and its $default stage serves
  # at the root, so URLs carry no stage prefix.
  WASHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: WASZcapAuthorizer
        Authorizers:
          WASZcapAuthorizer:
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            FunctionArn: !GetAtt WASZcapAuthorizerFn.Arn
            # No Identity.Headers: an identity source would make API Gateway
            # answer unsigned requests itself with a 401, and unsigned GETs
            # must reach the functions for the public-read policy check.
            Identity:
              # Every zcap invocation is signed over its own request, so a
              # cached authorization result would be meaningless. 0 disables
              # the authorizer result cache.
              ReauthorizeEvery: 0
      CorsConfiguration:
        AllowMethods:
          - GET
          - HEAD
          - POST
          - PUT
          - DELETE
          - OPTIONS
        # '*' covers the signed headers (authorization, capability-invocation,
        # digest, date, if-match, key-epoch, ...) and anything a client adds.
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'
        # A browser client needs the validators and the discovery link.
        ExposeHeaders:
          - ETag
          - Location
          - Link
          - Last-Modified
          - Content-Type
        MaxAge: 600

  # Verifies the capability invocation of every signed request and reports
  # the result in the request context (signed, verified, controller,
  # delegated, spaceController, spaceType, or space=missing). It never
  # denies: a gateway denial is always a 403, and the spec's answers to an
  # unauthorized request are shaped by the endpoint functions.
  WASZcapAuthorizerFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/authorizer
      Handler: app.lambdaHandler
      # The verification stack is bundled; the shared layer is not needed.
      Layers: []
      Policies:
        - DynamoDBReadPolicy:
            TableName: wallet-spaces
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2022"
        Format: "esm"
        Platform: "node"
        External:
          - "@aws-sdk/*"
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - app.mjs
        # createRequire lets the bundled CJS dependencies work inside an ESM
        # output.
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  # ---------------------------------------------------------------------------
  # One function per endpoint. Each carries only the actions and key prefixes
  # its operation touches: a read function cannot write or delete, a
  # function on one prefix (meta/, policies/, collections/) cannot reach
  # another, and only the two Space-level functions can create or delete a
  # bucket or a registry row. Functions that serve unsigned public reads also
  # read policies/* for the PublicCanRead cascade.
  # ---------------------------------------------------------------------------

  # GET / -- the service description. No authorization, no permissions.
  ServiceGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/service/get
      Handler: app.lambdaHandler
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /
            Method: get
            Auth:
              Authorizer: NONE
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /
            Method: head
            Auth:
              Authorizer: NONE

  # POST /spaces/ -- provision a Space: a bucket with its metadata object, a
  # registry row, and a redeemed coupon.
  SpacesPostFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/spaces/post
      Handler: app.lambdaHandler
      Policies:
        - DynamoDBWritePolicy:
            TableName: wallet-spaces
        - DynamoDBCrudPolicy:
            TableName: !Ref WasCouponsTable
        - Statement:
            - Effect: Allow
              Action: s3:CreateBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/space.json
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: post
        PostSlash:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces/{p}
            Method: post

  # GET /spaces/ -- the signer's Spaces, from the registry's by-did index.
  SpacesGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/spaces/get
      Handler: app.lambdaHandler
      Policies:
        - DynamoDBReadPolicy:
            TableName: wallet-spaces
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces
            Method: get
        GetSlash:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /spaces/{p}
            Method: get

  # GET /space/{s}/ -- the Space's Collections. The gateway delivers the
  # trailing-slash container URL to the {collection_id} route with an empty
  # id; a non-empty id (the bare Collection URL) is answered with a 308.
  SpaceCollectionsGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/collections-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: head

  # POST /space/{s}/ -- create a Collection (its metadata object).
  CollectionCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/collection-create
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: post

  # DELETE /space/{s}/ -- the whole Space: empty and remove the bucket, then
  # the registry row. The only function that can delete a bucket.
  SpaceDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/delete
      Handler: app.lambdaHandler
      # Emptying a bucket can outlast the default.
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wallet-spaces
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:DeleteBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/*
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}
            Method: delete

  # GET /space/{s}/meta
  SpaceMetaGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/meta-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - meta/space.json
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/meta/space.json
                - arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: head

  # PUT /space/{s}/meta -- also mirrors the name to the registry row.
  SpaceMetaPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/meta-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - meta/space.json
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wallet-spaces
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/space.json
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/meta
            Method: put

  # /space/{s}/policy
  SpacePolicyGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: get

  SpacePolicyPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: put

  SpacePolicyDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/space/policy-delete
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/space.json
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/policies/space.json
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/policy
            Method: delete

  # GET /space/{s}/{c}/{r} -- a Resource's content; with an empty
  # resource_id (the gateway's reading of /space/{s}/{c}/), the Collection's
  # listing.
  ResourceGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: head

  # POST /space/{s}/{c}/ -- create a Resource with a server-assigned id (a
  # first write into a new Collection also writes its metadata object).
  ResourceCreateFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/create
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: post

  # PUT /space/{s}/{c}/{r} -- create or replace a Resource.
  ResourcePutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: put

  # DELETE /space/{s}/{c}/{r} -- a Resource with its metadata and policy;
  # with an empty resource_id, the whole Collection.
  ResourceDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/delete
      Handler: app.lambdaHandler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}
            Method: delete

  # /space/{s}/{c}/meta -- Collection Metadata (an implicit collection's is
  # synthesized from the presence of content, hence ListBucket).
  CollectionMetaGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/collection/meta-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/meta
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/meta
            Method: head

  CollectionMetaPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/collection/meta-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/meta
            Method: put

  # /space/{s}/{c}/policy
  CollectionPolicyGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/collection/policy-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: get

  CollectionPolicyPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/collection/policy-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: put

  CollectionPolicyDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/collection/policy-delete
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/policy
            Method: delete

  # /space/{s}/{c}/{r}/meta -- Resource Metadata (derived from the content
  # object's head, plus the stored annotation).
  ResourceMetaGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/meta-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
                  - policies/*
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - arn:aws:s3:::dcc-was-*/collections/*
                - arn:aws:s3:::dcc-was-*/meta/*
                - arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/meta
            Method: get
        Head:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/meta
            Method: head

  ResourceMetaPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/meta-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - collections/*
                  - meta/*
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/collections/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/meta/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/meta
            Method: put

  # /space/{s}/{c}/{r}/policy
  ResourcePolicyGetFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/policy-get
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: get

  ResourcePolicyPutFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/policy-put
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: put

  ResourcePolicyDeleteFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/resource/policy-delete
      Handler: app.lambdaHandler
      Policies:
        - Statement:
            # Without ListBucket, S3 answers a HEAD/GET of a missing key with
            # 403 rather than 404; the prefix condition keeps it to this
            # function's own keys.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: arn:aws:s3:::dcc-was-*
              Condition:
                StringLike:
                  s3:prefix:
                  - policies/*
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: arn:aws:s3:::dcc-was-*/policies/*
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/policy
            Method: delete

  # The paths no endpoint owns: the bare Space URL (a 308 to its canonical
  # form) and anything below a Resource (405 for reserved segments such as
  # meta/log and chunks, else 404). Explicit routes rather than $default: a
  # $default route would also receive the browser's CORS preflight (OPTIONS),
  # which must reach the gateway's own CORS handling. No authorization, no
  # permissions. A path outside these gets the gateway's own 404.
  DefaultFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/endpoints/default
      Handler: app.lambdaHandler
      Events:
        BareSpaceGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: get
            Auth:
              Authorizer: NONE
        BareSpaceHead:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: head
            Auth:
              Authorizer: NONE
        BareSpacePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: put
            Auth:
              Authorizer: NONE
        BareSpacePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: post
            Auth:
              Authorizer: NONE
        BareSpaceDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}
            Method: delete
            Auth:
              Authorizer: NONE
        BelowResourceGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: get
            Auth:
              Authorizer: NONE
        BelowResourceHead:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: head
            Auth:
              Authorizer: NONE
        BelowResourcePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: put
            Auth:
              Authorizer: NONE
        BelowResourcePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: post
            Auth:
              Authorizer: NONE
        BelowResourceDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref WASHttpApi
            Path: /space/{space_id}/{collection_id}/{resource_id}/{proxy+}
            Method: delete
            Auth:
              Authorizer: NONE

Outputs:
  ApiEndpoint:
    Description: The API's base URL (the service description is at its root)
    Value: !Sub "https://${WASHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  WasLibLayer:
    Description: The shared-code layer ARN
    Value: !Ref WasLibLayer
