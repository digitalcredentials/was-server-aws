name: Report a problem
description: Tell us about something that went wrong in the alpha.
body:
  - type: markdown
    attributes:
      value: >-
        This is alpha software. Thank you for reporting. We read every issue,
        but may not answer or fix it during the alpha.
  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
      description: The steps you took, in order.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. Include any error message.
    validations:
      required: true
  - type: textarea
    id: what-you-expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: >-
        Optional. Drag images here or click to choose them. Screenshots are
        public, like the rest of this issue, so cover your email, your name,
        and anything else private first.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp"
